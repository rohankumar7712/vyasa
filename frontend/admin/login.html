<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyasa - Admin Login</title>
    <!-- Google Fonts: Inter & Hanken Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --login-primary: #002B7F;
            --login-primary-hover: #164096;
            --login-bg: #F8FAFC;
            --login-card-bg: rgba(255, 255, 255, 0.9);
            --login-text: #2b2b2b;
            --login-muted: #828a99;
        }

        body.login-page {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e7ff 0%, #dbeafe 100%);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Decorative Background Elements */
        body.login-page::before,
        body.login-page::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.6;
        }

        body.login-page::before {
            width: 400px;
            height: 400px;
            background: #93c5fd;
            top: -100px;
            left: -100px;
            animation: float 8s ease-in-out infinite alternate;
        }

        body.login-page::after {
            width: 500px;
            height: 500px;
            background: #a7f3d0;
            bottom: -150px;
            right: -150px;
            animation: float 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        .login-card {
            background: var(--login-card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            z-index: 1;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            width: 120px;
            margin-bottom: 24px;
            transition: transform 0.3s ease;
        }

        .login-logo:hover {
            transform: scale(1.05);
        }

        .login-title {
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--login-text);
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 0.95rem;
            color: var(--login-muted);
        }

        .login-form .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .login-form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--login-text);
            margin-bottom: 8px;
        }

        .login-form .input-wrapper {
            position: relative;
            transition: all 0.3s ease;
        }

        .login-form input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--login-text);
            background: #fff;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .login-form .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            transition: color 0.3s ease;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--login-primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .login-form input:focus + .input-icon {
            color: var(--login-primary);
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            font-size: 0.875rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--login-text);
        }

        .remember-me input {
            accent-color: var(--login-primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-password {
            color: var(--login-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: var(--login-primary-hover);
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--login-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            background: var(--login-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login i {
            transition: transform 0.3s ease;
        }

        .btn-login:hover i {
            transform: translateX(4px);
        }

        .login-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.875rem;
            color: var(--login-muted);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <img src="../Images/vyasa logo.webp" alt="Vyasa Logo" class="login-logo" onerror="this.src='https://placehold.co/120x40/2563eb/white?text=VYASA'">
            <h1 class="login-title">Admin Panel</h1>
            <p class="login-subtitle">Sign in to manage your institution</p>
        </div>

        <form class="login-form" id="adminLoginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="Enter Email id " required autocomplete="email">
                    <i class="fa-regular fa-envelope input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                  <i class="fa-solid fa-lock input-icon"></i>
                </div>
            </div>

            <div class="login-options">
                <label class="remember-me">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>
                <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login">
                Sign In
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="login-footer">
            <p>&copy; 2026 Vyasa International School. All rights reserved.</p>
        </div>
    </div>

    <!-- Script to handle login and set session -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('adminLoginForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    // Set secure token/flag in localStorage
                    localStorage.setItem('admin_logged_in', 'true');
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                });
            }

            const inputs = document.querySelectorAll('.login-form input');
            
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    const icon = this.nextElementSibling;
                    if (icon && icon.classList.contains('input-icon')) {
                        icon.style.color = 'var(--login-primary)';
                    }
                });

                input.addEventListener('blur', function() {
                    const icon = this.nextElementSibling;
                    if (icon && icon.classList.contains('input-icon')) {
                        icon.style.color = '#94a3b8';
                    }
                });
            });
        });
    </script>
</body>
</html>
